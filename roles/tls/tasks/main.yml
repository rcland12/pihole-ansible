---
- name: The CA must be given
  ansible.builtin.assert:
    that: pihole_tls_ca_cert | length > 0 and pihole_tls_ca_key | length > 0
    fail_msg: "Set pihole_tls_ca_cert and pihole_tls_ca_key: the CA that signs Pi-hole's certificate."

- name: The CA must be present
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [pihole_tls_ca_cert, pihole_tls_ca_key] + ([pihole_tls_ca_password_file] if pihole_tls_ca_password_file else []) }}"
  register: tls_ca_files
  failed_when: not tls_ca_files.stat.exists

- name: The root that checks it
  ansible.builtin.set_fact:
    tls_root: "{{ pihole_tls_ca_root if pihole_tls_ca_root else pihole_tls_ca_cert }}"

# Reissue when the certificate is missing, lacks a name, expires within
# pihole_tls_renew_days, or no longer chains to this CA (e.g. the CA changed).
# -no-CApath -no-CAstore: -CAfile alone also trusts the system store, so a
# certificate from an old CA still installed there would count as good.
- name: Is the current certificate still good?
  ansible.builtin.shell: |
    set -euo pipefail
    f={{ pihole_tls_file | quote }}
    [[ -s "$f" ]] || { echo "missing"; exit 0; }
    t=$(mktemp -d); trap 'rm -rf "$t"' EXIT
    # pihole.pem is key + certificate + chain; the first certificate is ours.
    awk '/BEGIN CERTIFICATE/{n++} n==1' "$f" > "$t/leaf.pem"
    openssl verify -no-CApath -no-CAstore -CAfile {{ tls_root | quote }} -untrusted {{ pihole_tls_ca_cert | quote }} "$t/leaf.pem" >/dev/null 2>&1 \
      || { echo "not from this CA"; exit 0; }
    openssl x509 -in "$t/leaf.pem" -noout -checkend $(( {{ pihole_tls_renew_days | int }} * 86400 )) >/dev/null \
      || { echo "expires soon"; exit 0; }
    have=$(openssl x509 -in "$t/leaf.pem" -noout -ext subjectAltName 2>/dev/null \
           | tail -n +2 | tr ',' '\n' | sed -E 's/^ *(DNS|IP Address)://' | sort -u)
    for n in {{ pihole_tls_names | map('quote') | join(' ') }}; do grep -qx "$n" <<<"$have" || { echo "missing $n"; exit 0; }; done
    echo covered
  args:
    executable: /bin/bash
  register: tls_state
  changed_when: false

- name: Why it is being reissued
  ansible.builtin.debug:
    msg: "Web certificate: {{ tls_state.stdout }}{{ ' (pihole_tls_renew)' if pihole_tls_renew | bool else '' }}"
  when: tls_state.stdout != 'covered' or pihole_tls_renew | bool

- name: Issue the certificate (key + cert + chain in one PEM, as FTL expects)
  when: tls_state.stdout != 'covered' or pihole_tls_renew | bool
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    d=$(mktemp -d); trap 'rm -rf "$d"' EXIT
    san=()
    for n in {{ pihole_tls_names | map('quote') | join(' ') }}; do
      if [[ $n =~ ^[0-9.]+$ ]]; then san+=("IP:$n"); else san+=("DNS:$n"); fi
    done
    cat > "$d/ext" <<EOF
    basicConstraints = critical, CA:FALSE
    keyUsage = critical, digitalSignature
    extendedKeyUsage = serverAuth
    subjectKeyIdentifier = hash
    authorityKeyIdentifier = keyid
    subjectAltName = $(IFS=,; echo "${san[*]}")
    EOF
    openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
      -keyout "$d/key.pem" -out "$d/req.csr" -subj "/CN={{ pihole_tls_names[0] }}" 2>/dev/null
    openssl x509 -req -in "$d/req.csr" -sha256 -days {{ pihole_tls_days | int }} \
      -CA {{ pihole_tls_ca_cert | quote }} -CAkey {{ pihole_tls_ca_key | quote }} \
      {% if pihole_tls_ca_password_file %}-passin file:{{ pihole_tls_ca_password_file | quote }}{% endif %} \
      -set_serial "0x$(openssl rand -hex 16)" -extfile "$d/ext" -out "$d/cert.pem" 2>/dev/null
    openssl verify -no-CApath -no-CAstore -CAfile {{ tls_root | quote }} -untrusted {{ pihole_tls_ca_cert | quote }} "$d/cert.pem" >/dev/null
    install -d -o pihole -g pihole -m 755 {{ pihole_tls_file | dirname | quote }}
    {% if pihole_tls_ca_cert != tls_root %}
    cat "$d/key.pem" "$d/cert.pem" {{ pihole_tls_ca_cert | quote }} > "$d/pihole.pem"
    {% else %}
    cat "$d/key.pem" "$d/cert.pem" > "$d/pihole.pem"
    {% endif %}
    # Keep the certificate that works, to put back if FTL rejects this one.
    if [[ -s {{ pihole_tls_file | quote }} ]]; then cp -p {{ pihole_tls_file | quote }} {{ (pihole_tls_file ~ '.prev') | quote }}; fi
    install -o pihole -g pihole -m 600 "$d/pihole.pem" {{ pihole_tls_file | quote }}
  args:
    executable: /bin/bash
  register: tls_issued
  changed_when: true

# FTL refuses to start its web server - admin UI and API - over a certificate
# file it cannot parse (mbedTLS: e.g. a CA with a critical extension it does
# not know), while DNS keeps working. So a failed check puts the previous
# file back rather than leaving the UI down.
- name: Load it and check the admin UI
  block:
    - name: Restart FTL to load it
      when: tls_issued is changed
      ansible.builtin.systemd_service:
        name: pihole-FTL
        state: restarted

    # --capath on an empty directory: --cacert alone still trusts the system
    # store too, so a certificate from an old CA still installed there would pass.
    - name: Admin UI answers over HTTPS with a certificate the CA vouches for
      ansible.builtin.shell: >-
        e=$(mktemp -d); trap 'rmdir "$e"' EXIT;
        curl -sS -o /dev/null -w '%{http_code}' --cacert {{ tls_root | quote }} --capath "$e"
        --resolve {{ pihole_tls_names[0] }}:443:127.0.0.1 https://{{ pihole_tls_names[0] }}/admin/
      args:
        executable: /bin/bash
      register: tls_http
      until: tls_http.stdout in ['200', '302', '308']
      retries: 15
      delay: 2
      changed_when: false
  rescue:
    - name: Was there a previous certificate?
      ansible.builtin.stat:
        path: "{{ pihole_tls_file }}.prev"
      register: tls_prev

    - name: Put the previous certificate back
      ansible.builtin.copy:
        src: "{{ pihole_tls_file }}.prev"
        dest: "{{ pihole_tls_file }}"
        remote_src: true
        owner: pihole
        group: pihole
        mode: "0600"
      when: tls_issued is changed and tls_prev.stat.exists

    - name: Restart FTL with it
      ansible.builtin.systemd_service:
        name: pihole-FTL
        state: restarted
      when: tls_issued is changed and tls_prev.stat.exists

    - name: Fail, saying why
      ansible.builtin.fail:
        msg: >-
          The admin UI did not come up with the new certificate
          {{ '(the previous one is back in place)' if (tls_issued is changed and tls_prev.stat.exists) else '' }}.
          See /var/log/pihole/FTL.log for "Cannot parse certificate" and webserver.log.
